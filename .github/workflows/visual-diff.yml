name: Visual Regression (Pixel-by-Pixel Comparison)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  visual-regression:
    name: Playwright Pixel-by-Pixel Snapshot Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Pixel-by-Pixel Snapshot Tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Visual Comparison Report & Diffs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
